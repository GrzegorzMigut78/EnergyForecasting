[project]
name = "prognozowanie"
version = "0.1.0"
description = "Wielomodelowe prognozowanie godzinowego zapotrzebowania na energię: symulacja operacyjna i ocena sposobów łączenia prognoz"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "statsforecast>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=4.0",
    "pyarrow>=16",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "holidays>=0.50",
    "joblib>=1.4",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
deep = ["neuralforecast>=1.7"]
gefcom = ["rdata>=0.11"]  # tylko do pobrania danych GEFCom2012

[project.scripts]
prognozowanie = "prognozowanie.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognozowanie"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "PD"]
ignore = ["PD011", "PD010"]  # pivot przy unikalnym indeksie jest celowy

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: testy trwające dłużej niż kilka sekund"]
