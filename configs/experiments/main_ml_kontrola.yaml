# Kontrola estymacji (plan analizy, sekcja 4, analiza dodatkowa): wszystkie człony SARIMA
# szacowane dokładną wiarygodnością (statsmodels) zamiast CSS, na ciągłym fragmencie: wydania
# 1-31.10.2002, rozgrzewka od 22.09.2002. Porównanie rankingu modeli i metod z przebiegiem
# głównym na tych samych dobach. Modele jak w main.yaml (te same parametry z identyfikacji),
# zmienia się wyłącznie metoda estymacji SARIMA. Lista modeli wygenerowana z main.yaml.
extends: main.yaml
name: main_ml_kontrola
description: 'Kontrola: SARIMA metodą dokładnej wiarygodności, wydania 1-31.10.2002.'
periods:
  forecast_start: 2002-09-22
  test: {start: 2002-10-01, end: 2002-10-31}
models:
- name: MR_ARIMA
  type: two_stage
  provisional: true
  first: {type: regression}
  residual:
    type: sarima
    order: [1, 0, 1]
    seasonal_order: [0, 1, 1]
    season: 168
    method: ml
- type: sarima
  order: [1, 0, 1]
  seasonal_order: [0, 1, 1]
  season: 168
  method: ml
  name: ARIMA
  provisional: true
- name: ES_ARIMA
  type: two_stage
  provisional: true
  first: {type: exp_smoothing, trend: add, damped: false, initialization: heuristic, season: 168}
  residual:
    type: sarima
    order: [1, 0, 1]
    seasonal_order: [0, 0, 1]
    season: 168
    method: ml
- name: SVR_ARIMA
  type: two_stage
  provisional: true
  first: {type: svr, kernel: poly, degree: 2, C: 12.0, epsilon: 0.076, gamma: 0.089, coef0: 1.586}
  residual:
    type: sarima
    order: [1, 0, 1]
    seasonal_order: [0, 1, 1]
    season: 168
    method: ml
- name: NN_ARIMA
  type: two_stage
  provisional: true
  first: {type: mlp, hidden_layer_sizes: 7, activation: relu, solver: lbfgs, alpha: 6.2e-06, tol: 3.01e-05,
    n_seeds: 5}
  residual:
    type: sarima
    order: [1, 0, 1]
    seasonal_order: [0, 1, 1]
    season: 168
    method: ml
- {name: SNAIVE, type: seasonal_naive, role: benchmark, lag: 168}
- {name: HONG, type: hong_regression, role: benchmark}
- name: LGBM
  type: lightgbm
  role: benchmark
  provisional: true
  lags: [48, 72, 168]
- name: HONG_ARIMA
  type: two_stage
  role: auxiliary
  provisional: true
  first: {type: hong_regression}
  residual:
    type: sarima
    order: [1, 0, 1]
    seasonal_order: [0, 1, 1]
    season: 168
    method: ml
- type: sarima
  order: [1, 0, 1]
  seasonal_order: [0, 1, 1]
  season: 24
  method: ml
  name: ARIMA_S24
  role: auxiliary
  provisional: true
