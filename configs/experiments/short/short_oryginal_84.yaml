# Wygenerowane przez scripts/konfiguracje_short.py (plan 10.3); nie edytować.
name: short_oryginal_84
description: 'Plan 10.3: ElecEner Short, okno 84 dni, parametry pierwszej wersji (SVR,
  sieć, rzędy ARIMA z opisu).'
dataset: configs/datasets/elecener_short.yaml
seed: 20261111
periods:
  identification:
    start: 2001-11-01
    end: 2002-03-31
  forecast_start: '2003-01-24'
  test:
    start: '2003-01-24'
    end: '2003-01-30'
forecast:
  horizon_hours: 48
  training_window_days: 84
  origin_hour: 0
  fitted_hours_saved: 168
temperature_scenarios:
- name: oracle
  kind: oracle
- name: persistence
  kind: persistence
models:
- name: MR_ARIMA
  type: two_stage
  provisional: false
  first:
    type: regression
  residual:
    type: sarima
    order:
    - 1
    - 0
    - 1
    seasonal_order:
    - 0
    - 1
    - 1
    season: 168
    method: css
- type: sarima
  order:
  - 1
  - 1
  - 3
  seasonal_order:
  - 1
  - 1
  - 1
  season: 168
  method: css
  name: ARIMA
  provisional: false
- name: ES_ARIMA
  type: two_stage
  provisional: false
  first:
    type: exp_smoothing
    trend: add
    damped: false
    initialization: heuristic
    season: 168
  residual:
    type: sarima
    order:
    - 1
    - 0
    - 3
    seasonal_order:
    - 1
    - 1
    - 1
    season: 168
    method: css
- name: SVR_ARIMA
  type: two_stage
  provisional: false
  first:
    type: svr
    kernel: poly
    degree: 2
    C: 12.0
    epsilon: 0.076
    gamma: 0.089
    coef0: 1.586
  residual:
    type: sarima
    order:
    - 1
    - 0
    - 0
    seasonal_order:
    - 0
    - 1
    - 1
    season: 168
    method: css
- name: NN_ARIMA
  type: two_stage
  provisional: false
  first:
    type: mlp
    hidden_layer_sizes: 7
    activation: relu
    solver: lbfgs
    alpha: 6.2e-06
    tol: 3.01e-05
    n_seeds: 5
  residual:
    type: sarima
    order:
    - 1
    - 0
    - 2
    seasonal_order:
    - 1
    - 1
    - 1
    season: 168
    method: css
- name: SNAIVE
  type: seasonal_naive
  role: benchmark
  lag: 168
  provisional: false
- name: HONG
  type: hong_regression
  role: benchmark
  provisional: false
- name: LGBM
  type: lightgbm
  role: benchmark
  provisional: false
  lags:
  - 48
  - 72
  - 168
combination:
  base_models:
  - MR_ARIMA
  - ARIMA
  - ES_ARIMA
  - SVR_ARIMA
  - NN_ARIMA
  methods:
  - C0
  - C1
  - C2
  - C3
  - C4
  - C5
  - C6
  - C7
  - C8
  k_days:
  - 2
  - 3
  - 7
  - 14
  - 28
  c0_fitted_hours:
  - 48
  - 72
  - 168
evaluation:
  excluded_data: []
  families:
    H1:
      question: czy regresja łącząca wygrywa ze zwykłą średnią
      reference: C3
      compare:
      - C1_K2
      - C1_K3
      - C1_K7
    H2:
      question: czy wagi z wartości dopasowanych (procedura pierwotna) są gorsze od
        wag z prognoz, na tych samych 48 obserwacjach
      reference: C1_K2
      compare:
      - C0
    H3:
      question: czy regresja łącząca wygrywa z każdym modelem pojedynczym i benchmarkiem
      reference: C1_K2
      compare:
      - MR_ARIMA
      - ARIMA
      - ES_ARIMA
      - SVR_ARIMA
      - NN_ARIMA
      - SNAIVE
      - HONG
      - LGBM
  confirm_scenarios:
  - oracle
  - persistence
  alpha: 0.05
execution:
  n_jobs: 2
  output_dir: results/short
